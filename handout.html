<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-page handout · Queens College Political Science Pathways</title>
<meta name="description" content="A printable one-page summary of the graduate school or law school path for Queens College Political Science majors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400..700&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
  /* One letter page, black on white so it prints well on any printer: no color, no gray fills,
     structure from type size, weight and a few solid rules. On screen it shows as a sheet of paper. */
  :root{
    --ink:#000; --paper:#fff; --desk:#e9e9e6; color-scheme:light;
    --display:"Libre Baskerville", Baskerville, Georgia, serif;
    --text:"Cabin", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--desk);color:var(--ink);font:400 10pt/1.42 var(--text);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .page a{text-decoration:none}
  .digital .page a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}

  .tools{max-width:8.5in;margin:20px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font:600 11pt/1.3 var(--text)}
  .tools button{font:700 11pt/1 var(--text);background:var(--ink);color:#fff;border:0;min-height:44px;padding:0 22px;cursor:pointer}
  .tools .switch{margin-left:auto}

  .page{width:8.5in;min-height:11in;margin:16px auto 48px;background:var(--paper);padding:.4in .4in .35in;display:flex;flex-direction:column}

  /* masthead */
  .mast{display:flex;justify-content:space-between;gap:16px;font:700 9pt/1.2 var(--text);padding-bottom:7px;border-bottom:3pt solid var(--ink)}
  .mast .url{font-weight:600}
  .head{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 .4in;align-items:end;margin-top:18px}
  h1{font:700 34pt/1 var(--display);letter-spacing:-.025em;margin:0}
  .intro{margin:0;font-size:10.5pt;line-height:1.42}

  h2{font:700 13pt/1.2 var(--display);letter-spacing:-.01em;margin:0 0 6px}
  /* sections share any spare height on the page, so the shorter law page still fills it */
  section{padding-top:16px;margin-top:auto}
  .head + section{padding-top:22px}

  /* degrees (graduate) or what admissions reads (law): one column each */
  .first{display:grid;gap:0 18px}
  .first > div{border-top:1.5pt solid var(--ink);padding-top:6px}
  .first b{display:block;font:700 13pt/1.15 var(--display);margin-bottom:3px}
  .first p{margin:0;font-size:9pt;line-height:1.33}

  /* year by year */
  .years{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 18px}
  .year{border-top:1.5pt solid var(--ink);padding-top:7px}
  .year.key{border-top-width:4pt;padding-top:4.5px}
  .year h3{font:700 14pt/1.1 var(--display);letter-spacing:-.01em;margin:0}
  .year .focus{margin:3px 0 0;font-weight:700;font-size:9.5pt}
  .year .tag{display:inline-block;margin-top:4px;font:italic 700 9pt/1.2 var(--text)}
  ul.items{list-style:none;margin:7px 0 0;padding:0;font-size:9.5pt;line-height:1.33}
  ul.items li{position:relative;padding-left:11px;margin:0 0 4px}
  ul.items li::before{content:"";position:absolute;left:0;top:.55em;width:4px;height:4px;background:var(--ink)}

  /* deadlines and help */
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 .4in}
  dl.cal{margin:0;font-size:9.5pt;line-height:1.33;border-top:1.5pt solid var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding-top:6px}
  dl.cal dt{font-weight:700;white-space:nowrap}
  dl.cal dd{margin:0}
  .cal-note{margin:8px 0 0;font-size:8.5pt}
  ul.help{list-style:none;margin:0;padding:0;border-top:1.5pt solid var(--ink);font-size:9.5pt;line-height:1.33}
  ul.help li{padding:4px 0 2px}
  ul.help b{display:block}

  footer{margin-top:auto;padding-top:12px}
  .foot{border-top:3pt solid var(--ink);padding-top:10px;display:flex;justify-content:space-between;gap:.4in;align-items:center}
  .scan{display:flex;align-items:center;gap:14px}
  .scan img{display:block;width:.95in;height:.95in}
  .scan b{display:block;font:700 13pt/1.2 var(--display)}
  .scan span{display:block;margin-top:3px;font-size:9.5pt}
  .foot p{margin:0;font-size:8.5pt;max-width:3.3in}

  @media screen and (max-width:860px){
    .page{width:auto;min-height:0;margin:16px 12px 40px;padding:24px 18px}
    .head,.two{grid-template-columns:1fr}
    .intro{margin-top:12px}
    .years{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .first{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:14px 18px}
    .two > div + div{margin-top:22px}
    .foot{flex-direction:column;align-items:flex-start}
  }
  @media screen and (max-width:480px){
    .years,.first{grid-template-columns:1fr !important}
    h1{font-size:26pt}
  }

  @page{size:letter;margin:0}
  @media print{
    body{background:#fff}
    .tools{display:none}
    .page{width:8.5in;height:11in;min-height:0;margin:0;overflow:hidden}
  }
</style>
</head>
<body>
<div class="tools">
  <a href="about.html">Back to the guide</a>
  <button type="button" onclick="window.print()">Print</button>
  <a id="pdf" href="downloads/Pathways_Graduate_School_Handout.pdf">PDF to email</a>
  <span class="switch" id="switch"></span>
</div>
<article class="page" id="page" aria-live="polite"></article>
<script src="data.js"></script>
<script src="handout.js"></script>
</body>
</html>
