<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-page handout · Queens College Political Science Pathways</title>
<meta name="description" content="A printable one-page summary of the graduate school or law school path for Queens College Political Science majors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400..700&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
  /* the redesign's look on paper: a red band, large serif year names, no divider lines */
  :root{
    --red:#E71939; --red-ink:#B20E28; --ink:#000; --muted:#4a4a4a; --surface:#f2f2ef; --paper:#fff; color-scheme:light;
    --display:"Libre Baskerville", Baskerville, Georgia, serif;
    --text:"Cabin", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--text);font-size:9.5pt;line-height:1.4}
  a{color:inherit}
  .tools{max-width:8.5in;margin:18px auto 0;padding:0 16px;display:flex;gap:16px;align-items:center;font-size:11pt}
  .tools button{font:700 11pt var(--text);background:var(--red);color:#fff;border:0;padding:10px 18px;cursor:pointer}
  .tools .switch{margin-left:auto}
  .page{max-width:8.5in;margin:14px auto 40px;background:var(--paper);padding:0 0 .3in}
  header{background:var(--red);color:#fff;padding:.2in .45in .16in}
  .site{font-weight:700;font-size:9pt}
  h1{font-family:var(--display);font-weight:700;font-size:21pt;line-height:1.05;letter-spacing:-.02em;margin:4px 0 4px}
  .sub{font-size:8.5pt;margin:0;color:#fff}
  .page > :not(header){margin-left:.45in;margin-right:.45in}
  h2{font-family:var(--display);font-weight:700;font-size:11.5pt;margin:11px 0 4px}
  .intro{margin-top:10px;font-size:10pt}
  dl.degrees{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
  dl.degrees dt{font-weight:700}
  dl.degrees dd{margin:0}
  .years{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 16px}
  .years h3{font-family:var(--display);font-weight:700;font-size:11.5pt;margin:0 0 3px;letter-spacing:-.01em}
  ul{margin:0;padding-left:14px}
  li{margin:0 0 2px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}
  ol.deadlines{list-style:none;margin:0;padding:0}
  ol.deadlines li{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:2px 6px;margin:0}
  ol.deadlines li:nth-child(odd){background:var(--surface)}
  ol.deadlines .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--red-ink)}
  footer{margin-top:10px;font-size:7.5pt;color:var(--muted)}
  @media (max-width:640px){
    header{padding:20px 16px}
    .page > :not(header){margin-left:16px;margin-right:16px}
    .years,.two{grid-template-columns:1fr}
    .years > div{margin-bottom:10px}
  }
  @page{size:letter;margin:.4in}
  @media print{
    body{background:#fff}
    .tools{display:none}
    .page{margin:0;max-width:none}
    header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    ol.deadlines li:nth-child(odd){-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="tools">
  <a href="about.html">Back to the guide</a>
  <button type="button" onclick="window.print()">Print</button>
  <span class="switch" id="switch"></span>
</div>
<article class="page" id="page" aria-live="polite"></article>
<script src="data.js"></script>
<script src="handout.js"></script>
</body>
</html>
