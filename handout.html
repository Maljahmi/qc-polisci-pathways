<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-page handout · Queens College Political Science Pathways</title>
<meta name="description" content="A printable one-page summary of the graduate school or law school path for Queens College Political Science majors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400..700&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
  :root{
    --ink:#000; --paper:#fff; --desk:#e9e9e6; color-scheme:light;
    --display:"Libre Baskerville", Baskerville, Georgia, serif;
    --text:"Cabin", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  }
  /* Black on white so it prints on any printer. Readable for everyone: no text under 12pt, no italics, no tight
     letter-spacing, at most two columns, left-aligned. It runs to a second page rather than shrinking the type.
     Large print (?large=1): 18pt text in one column. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--desk);color:var(--ink);font:400 12pt/1.5 var(--text);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .page a{text-decoration:none}
  .digital .page a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}

  .tools{max-width:8.5in;margin:20px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font:600 12pt/1.3 var(--text)}
  .tools button{font:700 12pt/1 var(--text);background:var(--ink);color:#fff;border:0;min-height:44px;padding:0 22px;cursor:pointer}
  .tools .switch{margin-left:auto;display:flex;flex-wrap:wrap;gap:12px 20px}

  .page{width:8.5in;min-height:11in;margin:16px auto 48px;background:var(--paper);padding:.5in}

  /* masthead */
  .mast{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font:700 12pt/1.3 var(--text);padding-bottom:8px;border-bottom:3pt solid var(--ink)}
  .mast .url{font-weight:600}
  .head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px .4in;align-items:end;margin-top:18px}
  h1{font:700 34pt/1.05 var(--display);margin:0}
  .intro{margin:0;font-size:13pt;line-height:1.5}

  h2{font:700 17pt/1.25 var(--display);margin:0 0 8px;break-after:avoid}
  section{padding-top:22px}

  /* degrees (graduate) or what admissions reads (law) */
  .first{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:14px .35in}
  .first > div{border-top:1.5pt solid var(--ink);padding-top:8px;break-inside:avoid}
  .first b{display:block;font:700 15pt/1.2 var(--display);margin-bottom:4px}
  .first p{margin:0;font-size:12pt;line-height:1.45}

  /* year by year */
  .years{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px .35in}
  .year{border-top:1.5pt solid var(--ink);padding-top:8px;break-inside:avoid}
  .year.key{border-top-width:4pt;padding-top:5.5px}
  .year h3{font:700 16pt/1.2 var(--display);margin:0}
  .year .focus{margin:4px 0 0;font-weight:700;font-size:12pt}
  .year .tag{display:inline-block;margin-top:6px;padding:2px 8px;border:1.5pt solid var(--ink);font:700 12pt/1.3 var(--text)}
  ul.items{list-style:none;margin:8px 0 0;padding:0;font-size:12pt;line-height:1.45}
  ul.items li{position:relative;padding-left:16px;margin:0 0 6px}
  ul.items li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--ink)}

  /* when things usually close, and help */
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px .4in}
  dl.cal{margin:0;font-size:12pt;line-height:1.45;border-top:1.5pt solid var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;padding-top:8px}
  dl.cal dt{font-weight:700;white-space:nowrap}
  dl.cal dd{margin:0}
  .cal-note{margin:10px 0 0;font-size:12pt}
  ul.help{list-style:none;margin:0;padding:0;border-top:1.5pt solid var(--ink);font-size:12pt;line-height:1.45}
  ul.help li{padding:6px 0 4px;break-inside:avoid}
  ul.help b{display:block}

  footer{padding-top:24px;break-inside:avoid}
  .foot{border-top:3pt solid var(--ink);padding-top:12px;display:flex;justify-content:space-between;gap:.4in;align-items:center}
  .scan{display:flex;align-items:center;gap:16px}
  .scan img{display:block;width:1.1in;height:1.1in}
  .scan b{display:block;font:700 15pt/1.25 var(--display)}
  .scan span{display:block;margin-top:4px;font-size:12pt}
  .foot p{margin:0;font-size:12pt;max-width:3.6in}

  /* large print */
  .large body{font-size:18pt;line-height:1.5}
  .large .mast{font-size:16pt}
  .large h1{font-size:40pt}
  .large .intro{font-size:18pt}
  .large h2{font-size:24pt}
  .large .head,.large .first,.large .years,.large .two{grid-template-columns:1fr !important}
  .large .first b,.large .year h3,.large .scan b{font-size:22pt}
  .large .first p,.large .year .focus,.large .year .tag,.large ul.items,.large dl.cal,.large .cal-note,.large ul.help,.large .scan span,.large .foot p{font-size:18pt}
  .large ul.items li{padding-left:22px}
  .large ul.items li::before{width:9px;height:9px}
  .large .foot{flex-direction:column;align-items:flex-start}
  .large .scan img{width:1.6in;height:1.6in}

  @media screen and (max-width:860px){
    .page{width:auto;min-height:0;margin:16px 12px 40px;padding:24px 18px}
    .head,.two,.years,.first{grid-template-columns:1fr !important}
    .foot{flex-direction:column;align-items:flex-start}
  }
  @media screen and (max-width:480px){
    h1{font-size:28pt}
  }

  @page{size:letter;margin:.5in}
  @media print{
    body{background:#fff}
    .tools{display:none}
    .page{width:auto;min-height:0;margin:0;padding:0}
  }
</style>
<script data-goatcounter="https://maljahmi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div class="tools">
  <a href="about.html">Back to the guide</a>
  <button type="button" onclick="window.print()">Print</button>
  <a id="pdf" href="downloads/Pathways_Graduate_School_Handout.pdf" target="_blank" rel="noopener">PDF to email</a>
  <span class="switch" id="switch"></span>
</div>
<article class="page" id="page" aria-live="polite"></article>
<script src="data.js"></script>
<script src="handout.js"></script>
</body>
</html>
